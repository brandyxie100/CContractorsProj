services:
  postgres:
    image: postgres:15
    container_name: clements-postgres
    environment:
      POSTGRES_USER: clements
      POSTGRES_PASSWORD: clements!456
      POSTGRES_DB: equipment
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clements -d equipment"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
